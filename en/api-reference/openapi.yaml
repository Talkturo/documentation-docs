  /flow/{flowId}/trigger:
    post:
      tags: [TurboFlow, Webhooks]
      summary: Trigger a published flow
      operationId: triggerFlow
      description: |
        Runtime entry point for TurboFlow. Sign the raw request body with SHA-256 HMAC
        using the published version's trigger_secret and send the digest in X-Talkturo-Secret.
        Async mode (default) returns 202 with run_id. Sync mode (`?sync=true`) waits up to
        about 30 seconds for inline output.
      security:
        - HmacTalkturoSecret: []
      parameters:
        - $ref: "#/components/parameters/FlowId"
        - name: sync
          in: query
          required: false
          schema:
            type: boolean
          description: Wait for final output inline when true
        - name: X-Talkturo-Secret
          in: header
          required: true
          schema:
            type: string
          description: SHA-256 HMAC digest of the raw request body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [params]
              properties:
                params:
                  type: object
                  additionalProperties: true
                  description: Runtime input key-value pairs
                context:
                  type: object
                  additionalProperties: true
                  properties:
                    assistant_id:
                      type: string
      responses:
        "200":
          description: Sync execution completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowTriggerSyncResponse"
        "202":
          description: Async execution accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  run_id:
                    type: string
        "400":
          description: Bad request or invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Sync execution failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowTriggerSyncResponse"

