      bearerFormat: tk_live_ or tk_test_
      description: |
        Talkturo API key. Send as `Authorization: Bearer tk_live_...` or
        `Authorization: Bearer tk_test_...`. Default scope is `*`; rate limit defaults
        to 1000 requests per hour.
    SessionCookie:
      type: apiKey
      in: cookie
      name: sb-access-token
      description: |
        Authenticated Talkturo web session cookie (Supabase httpOnly session).
        Browser clients typically send this automatically after sign-in.
        Related refresh cookies may also be present depending on the client.
    JwtBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase access token JWT for desktop clients and account-management routes
        such as API key administration (`owner` / `admin` required for API keys).
        Send as `Authorization: Bearer eyJ...`.
    HmacTalkturoSecret:
      type: apiKey
      in: header
      name: X-Talkturo-Secret
      description: |
        SHA-256 HMAC digest of the raw request body. Used for TurboFlow published
        flow triggers (key = version trigger_secret) and some integration webhooks.
    StripeSignature:
      type: apiKey
      in: header
      name: stripe-signature
      description: |
        Stripe webhook signature verified with STRIPE_WEBHOOK_SECRET.
        The raw request body must be preserved for verification.

