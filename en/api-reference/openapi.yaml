openapi: 3.0.0
info:
  title: Talkturo LLC API
  version: 1.0.0
  description: |
    REST API for the Talkturo voice AI platform — assistants, telephony, phone numbers,
    credits, billing, CRM, TurboFlow workflows, webhooks, desktop auth, and account management.

    Most successful responses use a JSON envelope with a `success` flag and resource data.
    Failed responses return `success: false` with an `error` message.

    **Authentication**
    - **API keys** (`tk_live_` / `tk_test_`): `Authorization: Bearer tk_...` for server-to-server integrations
    - **Session cookies**: browser / first-party web app sessions
    - **JWT bearer tokens**: desktop clients and some account-management routes
    - **HMAC** (`X-Talkturo-Secret`): TurboFlow triggers and some integration webhooks
    - **Stripe signature**: billing webhooks

    Default API key rate limit is 1000 requests per hour.
  contact:
    name: Talkturo LLC
servers:
  - url: https://api.talkturo.com/api
    description: Primary Talkturo API server
  - url: https://app.talkturo.com/api
    description: App-origin API (same paths; used by some browser-oriented docs)
tags:
  - name: Authentication
    description: Credential testing and auth conventions
  - name: API Keys
    description: Create, list, update, and revoke account API keys
  - name: Assistants
    description: Create and manage voice assistants
  - name: Telephony
    description: Assistant telephony configuration, test calls, and phone number assignment
  - name: Phone Numbers
    description: Search, purchase, retrieve, and release phone numbers; carrier compliance webhooks
  - name: Knowledge Base
    description: Upload, list, and delete assistant knowledge base files
  - name: Credits
    description: Balances, deductions, checkout, auto-reload, and credit history
  - name: Billing
    description: Stripe billing webhooks, invoices, and billing debug
  - name: TurboFlow
    description: Visual workflows, triggers, integrations, secrets, and AI builder tools
  - name: Desktop Auth
    description: Desktop JWT sign-in, sign-up, refresh, and sign-out
  - name: Webhooks
    description: Inbound webhook and token endpoints across the platform
  - name: CRM Contacts
    description: Contact CRUD and bulk import
  - name: CRM Companies
    description: Company CRUD and company contacts
  - name: CRM Opportunities
    description: Opportunity / deal pipeline CRUD
  - name: CRM Campaigns
    description: Outbound campaigns, dashboards, and related CRM call insights
  - name: CRM Custom Fields
    description: Custom field definitions for contacts, companies, and opportunities

paths:
  /test-api-key:
    get:
      tags: [Authentication]
      summary: Test API key authentication
      operationId: testApiKey
      description: |
        Confirm that credentials are valid and accepted. Uses the same authentication flow
        as other API-key-enabled routes.
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Authentication succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Authentication succeeded
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      operationId: listApiKeys
      description: |
        Get all API keys for an account. Returns metadata only (never plaintext keys).
        Requires a Bearer JWT from an account member with the `owner` or `admin` role.
        Does not accept API key authentication.
      security:
        - JwtBearer: []
      parameters:
        - name: accountSlug
          in: query
          required: true
          description: Account slug that owns the API keys to list
          schema:
            type: string
      responses:
        "200":
          description: API key metadata list
          content:
            application/json:
              schema:
                type: object
                required: [apiKeys]
                properties:
                  apiKeys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [API Keys]
      summary: Create API key
      operationId: createApiKey
      description: |
        Create a new API key. The response includes `fullKey` once; store it immediately.
        Requires Bearer JWT with `owner` or `admin` role.
      security:
        - JwtBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "200":
          description: Created API key including one-time fullKey
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    allOf:
                      - $ref: "#/components/schemas/ApiKey"
                      - type: object
                        properties:
                          fullKey:
                            type: string
                            description: Plaintext key returned only at creation time
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ApiKeyId"
    patch:
      tags: [API Keys]
      summary: Update API key
      operationId: updateApiKey
      description: Update display metadata or active status. Does not rotate the key value.
      security:
        - JwtBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                isActive:
                  type: boolean
                  description: Set false to disable or true to re-enable
      responses:
        "200":
          description: Updated API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    $ref: "#/components/schemas/ApiKey"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [API Keys]
      summary: Revoke API key
      operationId: revokeApiKey
      description: Delete an API key and immediately revoke its access.
      security:
        - JwtBearer: []
      responses:
        "200":
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants:
    post:
      tags: [Assistants]
      summary: Create an assistant
      operationId: createAssistant
      description: |
        Create a new assistant under an account. Dual authentication via `withApiAuth`
        (API key or session cookie).
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountSlug, name]
              properties:
                accountSlug:
                  type: string
                  description: Account slug that owns the assistant
                name:
                  type: string
                  description: Assistant name
                templateId:
                  type: string
                  description: Optional template; when present, sets assistant type from the template
      responses:
        "200":
          description: Assistant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  assistant:
                    $ref: "#/components/schemas/Assistant"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}:
    parameters:
      - $ref: "#/components/parameters/AssistantId"
    patch:
      tags: [Assistants]
      summary: Update an assistant
      operationId: updateAssistant
      description: |
        Update an existing assistant. Accepts accountSlug and any assistant fields
        supported by the backend (prompts, voices, models, telephony settings, etc.).
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                accountSlug:
                  type: string
                name:
                  type: string
                voice:
                  type: string
                model:
                  type: string
                transcriptor_options:
                  type: object
                  description: Validated against the selected provider and model when present
      responses:
        "200":
          description: Assistant updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  assistant:
                    $ref: "#/components/schemas/Assistant"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Assistants]
      summary: Delete an assistant
      operationId: deleteAssistant
      description: Permanently delete an assistant by ID after ownership checks.
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Assistant deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/clone:
    post:
      tags: [Assistants]
      summary: Clone an assistant
      operationId: cloneAssistant
      description: Duplicate an assistant configuration into a new assistant record.
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      responses:
        "200":
          description: Assistant cloned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  assistant:
                    $ref: "#/components/schemas/Assistant"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/usage-stats:
    get:
      tags: [Assistants]
      summary: Retrieve assistant usage statistics
      operationId: getAssistantUsageStats
      description: Fetch usage data for a single assistant for monitoring or reporting.
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      responses:
        "200":
          description: Usage statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                    description: Usage data shape depends on available metrics
                    additionalProperties: true
                    properties:
                      total_calls:
                        type: number
                      total_minutes:
                        type: number
                      last_call_at:
                        type: string
                        format: date-time
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/webhooks/test:
    post:
      tags: [Webhooks, Assistants]
      summary: Test assistant webhook delivery
      operationId: testAssistantWebhook
      description: |
        Send a test webhook delivery for an assistant configuration.
        Intended for authenticated dashboard users, not third-party inbound webhooks.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      responses:
        "200":
          description: Test delivery result
          content:
            application/json:
              schema:
                type: object
                description: Delivery test result payload
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/test-call:
    post:
      tags: [Telephony]
      summary: Start a test outbound SIP call
      operationId: startTelephonyTestCall
      description: |
        Start a test outbound call from a phone number already assigned to the assistant.
        Creates a LiveKit room, dispatches the agent, then creates the outbound SIP participant.
        Performs a credit pre-flight check; returns 402 if balance is insufficient.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountSlug, fromNumber, toNumber]
              properties:
                accountSlug:
                  type: string
                fromNumber:
                  type: string
                  description: Active number already assigned to the assistant
                toNumber:
                  type: string
                  description: Destination number to dial
      responses:
        "200":
          description: Test call initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  roomName:
                    type: string
                  sipCallId:
                    type: string
                  message:
                    type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/inbound:
    parameters:
      - $ref: "#/components/parameters/AssistantId"
    get:
      tags: [Telephony]
      summary: Get inbound telephony configuration
      operationId: getInboundTelephony
      description: Return the current inbound telephony configuration for an assistant.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Inbound telephony configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Telephony]
      summary: Configure inbound telephony
      operationId: configureInboundTelephony
      description: Create or update inbound telephony configuration for the assistant.
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Inbound telephony configuration fields
              additionalProperties: true
      responses:
        "200":
          description: Inbound configuration saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/outbound:
    parameters:
      - $ref: "#/components/parameters/AssistantId"
    get:
      tags: [Telephony]
      summary: Get outbound telephony configuration
      operationId: getOutboundTelephony
      description: Return the current outbound telephony configuration for an assistant.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Outbound telephony configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Telephony]
      summary: Configure outbound telephony
      operationId: configureOutboundTelephony
      description: Create or update outbound telephony configuration for the assistant.
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Outbound telephony configuration fields
              additionalProperties: true
      responses:
        "200":
          description: Outbound configuration saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/settings:
    parameters:
      - $ref: "#/components/parameters/AssistantId"
    get:
      tags: [Telephony]
      summary: Get full telephony settings
      operationId: getTelephonySettings
      description: Return the assistant's full telephony settings object.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Telephony settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Telephony]
      summary: Update telephony settings
      operationId: updateTelephonySettings
      description: Partially update telephony settings for the assistant.
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Partial telephony settings
              additionalProperties: true
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/phone-numbers:
    parameters:
      - $ref: "#/components/parameters/AssistantId"
    get:
      tags: [Telephony]
      summary: List assistant telephony phone numbers
      operationId: listAssistantTelephonyPhoneNumbers
      description: Return phone numbers attached to the assistant.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Phone numbers attached to the assistant
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Telephony]
      summary: Manage assistant telephony phone numbers
      operationId: manageAssistantTelephonyPhoneNumbers
      description: Manage phone numbers for the assistant.
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Phone numbers updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/assign-phone-numbers:
    post:
      tags: [Telephony]
      summary: Assign phone numbers to an assistant
      operationId: assignAssistantPhoneNumbers
      description: Assign one or more existing account phone numbers to an assistant.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Phone number assignment payload
              additionalProperties: true
      responses:
        "200":
          description: Numbers assigned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/compliance-templates:
    get:
      tags: [Telephony]
      summary: List telephony compliance templates
      operationId: listTelephonyComplianceTemplates
      description: Return compliance templates available for telephony configuration.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      responses:
        "200":
          description: Compliance templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistant-phone-numbers:
    get:
      tags: [Telephony]
      summary: List account assistant phone numbers
      operationId: listAccountAssistantPhoneNumbers
      description: |
        Account-level session-auth endpoint that lists phone numbers attached to
        assistants across the account.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Assistant phone numbers across the account
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /phone-numbers/search:
    get:
      tags: [Phone Numbers]
      summary: Search available phone numbers
      operationId: searchPhoneNumbers
      description: Search carrier inventory filtered by location and feature requirements.
      security:
        - SessionCookie: []
      parameters:
        - name: areaCode
          in: query
          required: false
          schema:
            type: string
          description: Filter to a local area code
        - name: countryCode
          in: query
          required: false
          schema:
            type: string
          description: Country code such as US
        - name: phoneNumberPattern
          in: query
          required: false
          schema:
            type: string
          description: Carrier-supported number pattern
        - name: features
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated required capabilities (e.g. sms,voice)
      responses:
        "200":
          description: Available numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  numbers:
                    type: array
                    items:
                      $ref: "#/components/schemas/AvailablePhoneNumber"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /phone-numbers/purchase:
    post:
      tags: [Phone Numbers]
      summary: Purchase a phone number
      operationId: purchasePhoneNumber
      description: Provision a number to an account. May include carrier-specific compliance fields.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, accountSlug]
              additionalProperties: true
              properties:
                phoneNumber:
                  type: string
                accountSlug:
                  type: string
                bundleId:
                  type: string
                  description: Carrier-specific compliance bundle when required
      responses:
        "200":
          description: Number provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  phoneNumber:
                    $ref: "#/components/schemas/PhoneNumber"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /phone-numbers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique phone number identifier
    get:
      tags: [Phone Numbers]
      summary: Retrieve a phone number
      operationId: getPhoneNumber
      description: Retrieve a single phone number record by Talkturo identifier.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Phone number record
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  phoneNumber:
                    $ref: "#/components/schemas/PhoneNumber"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Phone Numbers]
      summary: Release a phone number
      operationId: releasePhoneNumber
      description: Release a provisioned number so it is no longer assigned to the account.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Phone number released
          content:
            application/json:
              schema:
