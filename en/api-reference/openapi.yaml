      summary: Telnyx KYC compliance webhook
      operationId: telnyxPhoneNumberWebhook
      description: |
        Carrier webhook for Telnyx KYC / requirement group status changes.
        Verifies ED25519 signature using TELNYX_PUBLIC_KEY. Returns 503 if key is
        not configured, 400 on bad signature. Always returns 200 after successful processing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Telnyx event payload
              additionalProperties: true
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  status:
                    type: string
                  updated:
                    type: boolean
                  matchedRequest:
                    type: boolean
        "400":
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: TELNYX_PUBLIC_KEY not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /phone-numbers/twilio-webhook:
    post:
      tags: [Phone Numbers, Webhooks]
      summary: Twilio bundle status webhook
      operationId: twilioPhoneNumberWebhook
      description: |
        Carrier callback for Twilio bundle status changes. No signature header required.
        Re-fetches current bundle status from Twilio before updating records. Always returns 200.
      security: []
      requestBody:
        required: true
        content:
