      summary: Receive provider integration webhook
      operationId: receiveFlowProviderWebhook
      description: |
        Inbound events from supported providers (e.g. cal.com, calendly, slack).
        Authenticated with per-webhook HMAC via X-Talkturo-Secret.
      security:
        - HmacTalkturoSecret: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
          description: Provider name (cal.com, calendly, slack, etc.)
        - name: X-Talkturo-Secret
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Invalid HMAC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

