      tags: [TurboFlow, Webhooks]
      summary: Verify Meta webhook
      operationId: verifyMetaWebhook
      description: Meta webhook verification handshake. Returns hub.challenge on success.
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: false
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Verification challenge echoed
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Verification failed
    post:
      tags: [TurboFlow, Webhooks]
      summary: Receive Meta lead events
      operationId: receiveMetaWebhook
      description: |
        Receive Meta / Facebook lead ads webhook events.
        Authenticated with HMAC derived from META_APP_SECRET (e.g. X-Hub-Signature-256).
      security:
        - HmacTalkturoSecret: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

