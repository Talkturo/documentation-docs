openapi: 3.0.0
info:
  title: Talkturo LLC API
  version: 1.0.0
  description: |
    REST-API für die Talkturo Voice-AI-Plattform — Assistenten, Telefonie, Telefonnummern,
    Guthaben, Abrechnung, CRM, TurboFlow-Workflows, Webhooks, Desktop-Auth und Kontoverwaltung.

    Die meisten erfolgreichen Antworten verwenden eine JSON-Hülle mit einem `success`-Flag und Ressourcendaten.
    Fehlgeschlagene Antworten geben `success: false` mit einer `error`-Meldung zurück.

    **Authentifizierung**
    - **API-Schlüssel** (`tk_live_` / `tk_test_`): `Authorization: Bearer tk_...` für Server-zu-Server-Integrationen
    - **Session-Cookies**: Browser- / First-Party-Web-App-Sitzungen
    - **JWT-Bearer-Tokens**: Desktop-Clients und einige Kontoverwaltungsrouten
    - **HMAC** (`X-Talkturo-Secret`): TurboFlow-Trigger und einige Integrations-Webhooks
    - **Stripe-Signatur**: Abrechnungs-Webhooks

    Das Standard-Rate-Limit für API-Schlüssel beträgt 1000 Anfragen pro Stunde.
  contact:
    name: Talkturo LLC
servers:
  - url: https://api.talkturo.com/api
    description: Primary Talkturo API server
  - url: https://app.talkturo.com/api
    description: App-origin API (same paths; used by some browser-oriented docs)
tags:
  - name: Authentifizierung
    description: Credential-Tests und Authentifizierungskonventionen
  - name: API-Schlüssel
    description: API-Schlüssel eines Kontos erstellen, auflisten, aktualisieren und widerrufen
  - name: Assistenten
    description: Voice-Assistenten erstellen und verwalten
  - name: Telefonie
    description: Telefonie-Konfiguration des Assistenten, Testanrufe und Telefonnummernzuweisung
  - name: Telefonnummern
    description: Telefonnummern suchen, kaufen, abrufen und freigeben; Carrier-Compliance-Webhooks
  - name: Wissensdatenbank
    description: Wissensdatenbank-Dateien eines Assistenten hochladen, auflisten und löschen
  - name: Guthaben
    description: Salden, Abzüge, Checkout, Auto-Reload und Guthabenverlauf
  - name: Abrechnung
    description: Stripe-Abrechnungs-Webhooks, Rechnungen und Abrechnungs-Debug
  - name: TurboFlow
    description: Visuelle Workflows, Trigger, Integrationen, Secrets und AI-Builder-Tools
  - name: Desktop-Auth
    description: Desktop-JWT-Anmeldung, Registrierung, Refresh und Abmeldung
  - name: Webhooks
    description: Eingehende Webhook- und Token-Endpunkte der Plattform
  - name: CRM-Kontakte
    description: Kontakt-CRUD und Massenimport
  - name: CRM-Unternehmen
    description: Unternehmens-CRUD und Unternehmenskontakte
  - name: CRM-Opportunities
    description: Opportunity-/Deal-Pipeline-CRUD
  - name: CRM-Kampagnen
    description: Outbound-Kampagnen, Dashboards und zugehörige CRM-Anruf-Insights
  - name: CRM-Benutzerdefinierte Felder
    description: Definitionen benutzerdefinierter Felder für Kontakte, Unternehmen und Opportunities

paths:
  /test-api-key:
    get:
      tags:
        - Authentifizierung
      summary: API-Schlüssel-Authentifizierung testen
      operationId: testApiKey
      description: |
        Bestätigen, dass Anmeldedaten gültig und akzeptiert sind. Verwendet denselben Authentifizierungsflow
        wie andere API-Schlüssel-fähige Routen.
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Authentifizierung erfolgreich
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Authentication succeeded
        "401":
          description: Ungültiger API-Schlüssel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api-keys:
    get:
      tags:
        - API-Schlüssel
      summary: API-Schlüssel auflisten
      operationId: listApiKeys
      description: |
        Alle API-Schlüssel eines Kontos abrufen. Gibt nur Metadaten zurück (niemals Klartext-Schlüssel).
        Erfordert ein Bearer-JWT von einem Kontomitglied mit der Rolle `owner` oder `admin`.
        Akzeptiert keine API-Schlüssel-Authentifizierung.
      security:
        - JwtBearer: []
      parameters:
        - name: accountSlug
          in: query
          required: true
          description: Account-Slug, dem die aufzulistenden API-Schlüssel gehören
          schema:
            type: string
      responses:
        "200":
          description: Metadatenliste der API-Schlüssel
          content:
            application/json:
              schema:
                type: object
                required: [apiKeys]
                properties:
                  apiKeys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Verboten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags:
        - API-Schlüssel
      summary: API-Schlüssel erstellen
      operationId: createApiKey
      description: |
        Einen neuen API-Schlüssel erstellen. Die Antwort enthält `fullKey` einmalig; sofort speichern.
        Erfordert Bearer-JWT mit der Rolle `owner` oder `admin`.
      security:
        - JwtBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "200":
          description: Erstellter API-Schlüssel inklusive einmaligem fullKey
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    allOf:
                      - $ref: "#/components/schemas/ApiKey"
                      - type: object
                        properties:
                          fullKey:
                            type: string
                            description: Klartext-Schlüssel nur bei der Erstellung zurückgegeben
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Verboten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ApiKeyId"
    patch:
      tags:
        - API-Schlüssel
      summary: API-Schlüssel aktualisieren
      operationId: updateApiKey
      description: Anzeigemetadaten oder Aktivstatus aktualisieren. Rotiert den Schlüsselwert nicht.
      security:
        - JwtBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                isActive:
                  type: boolean
                  description: false zum Deaktivieren oder true zum erneuten Aktivieren setzen
      responses:
        "200":
          description: Aktualisierter API-Schlüssel
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    $ref: "#/components/schemas/ApiKey"
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags:
        - API-Schlüssel
      summary: API-Schlüssel widerrufen
      operationId: revokeApiKey
      description: Einen API-Schlüssel löschen und den Zugriff sofort widerrufen.
      security:
        - JwtBearer: []
      responses:
        "200":
          description: API-Schlüssel widerrufen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants:
    post:
      tags:
        - Assistenten
      summary: Assistenten erstellen
      operationId: createAssistant
      description: |
        Einen neuen Assistenten unter einem Konto erstellen. Dual-Authentifizierung über `withApiAuth`
        (API-Schlüssel oder Session-Cookie).
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountSlug, name]
              properties:
                accountSlug:
                  type: string
                  description: Account-Slug, dem der Assistent gehört
                name:
                  type: string
                  description: Name des Assistenten
                templateId:
                  type: string
                  description: Optionales Template; setzt bei Angabe den Assistententyp aus dem Template
      responses:
        "200":
          description: Assistent erstellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  assistant:
                    $ref: "#/components/schemas/Assistant"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}:
    parameters:
      - $ref: "#/components/parameters/AssistantId"
    patch:
      tags:
        - Assistenten
      summary: Assistenten aktualisieren
      operationId: updateAssistant
      description: |
        Einen bestehenden Assistenten aktualisieren. Akzeptiert accountSlug und alle vom Backend
        unterstützten Assistentenfelder (Prompts, Stimmen, Modelle, Telefonie-Einstellungen usw.).
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                accountSlug:
                  type: string
                name:
                  type: string
                voice:
                  type: string
                model:
                  type: string
                transcriptor_options:
                  type: object
                  description: Wird bei Angabe gegen den ausgewählten Provider und das Modell validiert
      responses:
        "200":
          description: Assistent aktualisiert
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  assistant:
                    $ref: "#/components/schemas/Assistant"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags:
        - Assistenten
      summary: Assistenten löschen
      operationId: deleteAssistant
      description: Einen Assistenten nach Eigentumsprüfungen dauerhaft anhand der ID löschen.
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      responses:
        "200":
          description: Assistent gelöscht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/clone:
    post:
      tags:
        - Assistenten
      summary: Assistenten klonen
      operationId: cloneAssistant
      description: Eine Assistentenkonfiguration in einen neuen Assistenten-Datensatz duplizieren.
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      responses:
        "200":
          description: Assistent geklont
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  assistant:
                    $ref: "#/components/schemas/Assistant"
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/usage-stats:
    get:
      tags:
        - Assistenten
      summary: Nutzungsstatistik des Assistenten abrufen
      operationId: getAssistantUsageStats
      description: Nutzungsdaten für einen einzelnen Assistenten für Monitoring oder Reporting abrufen.
      security:
        - ApiKeyBearer: []
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      responses:
        "200":
          description: Nutzungsstatistik
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                    description: Form der Nutzungsdaten hängt von verfügbaren Metriken ab
                    additionalProperties: true
                    properties:
                      total_calls:
                        type: number
                      total_minutes:
                        type: number
                      last_call_at:
                        type: string
                        format: date-time
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/webhooks/test:
    post:
      tags:
        - Webhooks
        - Assistenten
      summary: Webhook-Zustellung des Assistenten testen
      operationId: testAssistantWebhook
      description: |
        Eine Test-Webhook-Zustellung für eine Assistentenkonfiguration senden.
        Für authentifizierte Dashboard-Benutzer gedacht, nicht für eingehende Third-Party-Webhooks.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      responses:
        "200":
          description: Ergebnis der Testzustellung
          content:
            application/json:
              schema:
                type: object
                description: Payload des Zustellungstests
                additionalProperties: true
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/test-call:
    post:
      tags:
        - Telefonie
      summary: Test-Outbound-SIP-Anruf starten
      operationId: startTelephonyTestCall
      description: |
        Einen Test-Outbound-Anruf von einer dem Assistenten bereits zugewiesenen Telefonnummer starten.
        Erstellt einen LiveKit-Raum, dispatcht den Agenten und erstellt dann den Outbound-SIP-Participant.
        Führt eine Guthaben-Vorprüfung durch; gibt 402 zurück, wenn der Saldo unzureichend ist.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountSlug, fromNumber, toNumber]
              properties:
                accountSlug:
                  type: string
                fromNumber:
                  type: string
                  description: Aktive Nummer, die dem Assistenten bereits zugewiesen ist
                toNumber:
                  type: string
                  description: Zielnummer zum Anrufen
      responses:
        "200":
          description: Testanruf gestartet
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  roomName:
                    type: string
                  sipCallId:
                    type: string
                  message:
                    type: string
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "402":
          description: Unzureichendes Guthaben
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Verboten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/inbound:
    parameters:
      - $ref: "#/components/parameters/AssistantId"
    get:
      tags:
        - Telefonie
      summary: Inbound-Telefonie-Konfiguration abrufen
      operationId: getInboundTelephony
      description: Die aktuelle Inbound-Telefonie-Konfiguration eines Assistenten zurückgeben.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Inbound-Telefonie-Konfiguration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags:
        - Telefonie
      summary: Inbound-Telefonie konfigurieren
      operationId: configureInboundTelephony
      description: Inbound-Telefonie-Konfiguration für den Assistenten erstellen oder aktualisieren.
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Felder der Inbound-Telefonie-Konfiguration
              additionalProperties: true
      responses:
        "200":
          description: Inbound-Konfiguration gespeichert
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/outbound:
    parameters:
      - $ref: "#/components/parameters/AssistantId"
    get:
      tags:
        - Telefonie
      summary: Outbound-Telefonie-Konfiguration abrufen
      operationId: getOutboundTelephony
      description: Die aktuelle Outbound-Telefonie-Konfiguration eines Assistenten zurückgeben.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Outbound-Telefonie-Konfiguration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags:
        - Telefonie
      summary: Outbound-Telefonie konfigurieren
      operationId: configureOutboundTelephony
      description: Outbound-Telefonie-Konfiguration für den Assistenten erstellen oder aktualisieren.
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Felder der Outbound-Telefonie-Konfiguration
              additionalProperties: true
      responses:
        "200":
          description: Outbound-Konfiguration gespeichert
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/settings:
    parameters:
      - $ref: "#/components/parameters/AssistantId"
    get:
      tags:
        - Telefonie
      summary: Vollständige Telefonie-Einstellungen abrufen
      operationId: getTelephonySettings
      description: Das vollständige Telefonie-Einstellungsobjekt des Assistenten zurückgeben.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Telefonie-Einstellungen
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags:
        - Telefonie
      summary: Telefonie-Einstellungen aktualisieren
      operationId: updateTelephonySettings
      description: Telefonie-Einstellungen des Assistenten teilweise aktualisieren.
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Teilweise Telefonie-Einstellungen
              additionalProperties: true
      responses:
        "200":
          description: Einstellungen aktualisiert
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/phone-numbers:
    parameters:
      - $ref: "#/components/parameters/AssistantId"
    get:
      tags:
        - Telefonie
      summary: Telefonie-Telefonnummern des Assistenten auflisten
      operationId: listAssistantTelephonyPhoneNumbers
      description: Dem Assistenten zugeordnete Telefonnummern zurückgeben.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Dem Assistenten zugeordnete Telefonnummern
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags:
        - Telefonie
      summary: Telefonie-Telefonnummern des Assistenten verwalten
      operationId: manageAssistantTelephonyPhoneNumbers
      description: Telefonnummern für den Assistenten verwalten.
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Telefonnummern aktualisiert
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/assign-phone-numbers:
    post:
      tags:
        - Telefonie
      summary: Telefonnummern einem Assistenten zuweisen
      operationId: assignAssistantPhoneNumbers
      description: Eine oder mehrere bestehende Kontotelefonnummern einem Assistenten zuweisen.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Payload der Telefonnummernzuweisung
              additionalProperties: true
      responses:
        "200":
          description: Nummern zugewiesen
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistants/{assistantId}/telephony/compliance-templates:
    get:
      tags:
        - Telefonie
      summary: Telefonie-Compliance-Templates auflisten
      operationId: listTelephonyComplianceTemplates
      description: Für die Telefonie-Konfiguration verfügbare Compliance-Templates zurückgeben.
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssistantId"
      responses:
        "200":
          description: Compliance-Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401":
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assistant-phone-numbers:
    get:
      tags:
        - Telefonie
      summary: Assistenten-Telefonnummern des Kontos auflisten
      operationId: listAccountAssistantPhoneNumbers
      description: |
        Kontoweiter Session-Auth-Endpunkt, der Telefonnummern auflistet, die
