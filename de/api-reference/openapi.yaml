            schema:
              type: object
              properties:
                BundleSID:
                  type: string
                BundleSid:
                  type: string
                bundle_sid:
                  type: string
      responses:
        "200":
          description: Callback akzeptiert
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  status:
                    type: string
                  matchedRequest:
                    type: boolean

