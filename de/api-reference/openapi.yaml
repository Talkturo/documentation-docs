components:
  securitySchemes:
    ApiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: tk_live_ or tk_test_
      description: |
        Talkturo-API-Schlüssel. Senden als `Authorization: Bearer tk_live_...` oder
        `Authorization: Bearer tk_test_...`. Standard-Scope ist `*`; Rate-Limit standardmäßig
        1000 Anfragen pro Stunde.
    SessionCookie:
      type: apiKey
      in: cookie
      name: sb-access-token
      description: |
        Authentifiziertes Talkturo-Web-Session-Cookie (Supabase-httpOnly-Session).
        Browser-Clients senden dies nach der Anmeldung typischerweise automatisch.
        Je nach Client können auch zugehörige Refresh-Cookies vorhanden sein.
    JwtBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-Access-Token-JWT für Desktop-Clients und Kontoverwaltungsrouten
        wie die API-Schlüssel-Verwaltung (`owner` / `admin` für API-Schlüssel erforderlich).
        Senden als `Authorization: Bearer eyJ...`.
    HmacTalkturoSecret:
      type: apiKey
      in: header
      name: X-Talkturo-Secret
      description: |
        SHA-256-HMAC-Digest des rohen Request-Body. Wird für veröffentlichte
        TurboFlow-Flow-Trigger (Key = Version `trigger_secret`) und einige Integrations-Webhooks verwendet.
    StripeSignature:
      type: apiKey
      in: header
      name: stripe-signature
      description: |
        Stripe-Webhook-Signatur, verifiziert mit STRIPE_WEBHOOK_SECRET.
        Der rohe Request-Body muss für die Verifizierung erhalten bleiben.

  parameters:
    AssistantId:
      name: assistantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Assistenten-UUID
    ApiKeyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: API-Schlüssel-UUID
    FlowId:
      name: flowId
      in: path
      required: true
      schema:
        type: string
      description: Flow-Kennung

  schemas:
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ApiKeyPermissions:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
          example: ["*"]
        rate_limit_per_hour:
          type: number
          example: 1000

    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        key_prefix:
          type: string
        permissions:
          $ref: "#/components/schemas/ApiKeyPermissions"
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid

    CreateApiKeyRequest:
      type: object
      required: [accountSlug, name]
      properties:
        accountSlug:
          type: string
        name:
          type: string
        description:
          type: string
        environment:
          type: string
          enum: [live, test]
          default: live
        expiresInDays:
          type: number
        permissions:
          $ref: "#/components/schemas/ApiKeyPermissions"

    Assistant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_slug:
          type: string
        name:
          type: string
        type:
          type: string
        voice:
          type: string
        model:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true

    AvailablePhoneNumber:
      type: object
      properties:
        phoneNumber:
          type: string
        country:
          type: string
        type:
          type: string
        cost:
          type: string
        features:
          type: array
          items:
            type: string

    PhoneNumber:
      type: object
      properties:
        id:
          type: string
        phoneNumber:
          type: string
        status:
          type: string
        accountSlug:
          type: string
      additionalProperties: true

    KnowledgeBaseFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        size:
          type: number
        type:
          type: string
        status:
          type: string
          description: Verarbeitungsstatus (z. B. processing, processed)
        created_at:
          type: string
          format: date-time

    CreditsRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        credits:
          type: number
        total_purchased:
          type: number
        total_used:
          type: number
        auto_reload_enabled:
          type: boolean
        auto_reload_threshold:
          type: number
        auto_reload_amount_usd:
          type: number

    Invoice:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        currency:
          type: string
        amount_due:
          type: number
        amount_paid:
          type: number
      additionalProperties: true

    Flow:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
      additionalProperties: true

    FlowTriggerSyncResponse:
      type: object
      properties:
        ok:
          type: boolean
        run_id:
          type: string
        output:
          type: object
          additionalProperties: true
        error:
          type: string
        failed_node:
          type: string
        partial_output:
          type: object
          additionalProperties: true

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        user_metadata:
          type: object
          additionalProperties: true

    AuthSessionEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            expires_in:
              type: integer
            expires_at:
              type: integer
            token_type:
              type: string
            user:
              $ref: "#/components/schemas/AuthUser"

    CrmContact:
      type: object
      properties:
        id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        company_id:
          type: string
        job_title:
          type: string
        lead_source:
