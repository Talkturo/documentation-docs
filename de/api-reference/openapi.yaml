  /flow/{flowId}/trigger:
    post:
      tags:
        - TurboFlow
        - Webhooks
      summary: Veröffentlichten Flow auslösen
      operationId: triggerFlow
      description: |
        Runtime-Einstiegspunkt für TurboFlow. Den rohen Request-Body mit SHA-256-HMAC
        unter Verwendung des trigger_secret der veröffentlichten Version signieren und den Digest in X-Talkturo-Secret senden.
        Async-Modus (Standard) gibt 202 mit run_id zurück. Sync-Modus (`?sync=true`) wartet bis zu
        etwa 30 Sekunden auf eine Inline-Ausgabe.
      security:
        - HmacTalkturoSecret: []
      parameters:
        - $ref: "#/components/parameters/FlowId"
        - name: sync
          in: query
          required: false
          schema:
            type: boolean
          description: Bei true auf die finale Ausgabe inline warten
        - name: X-Talkturo-Secret
          in: header
          required: true
          schema:
            type: string
          description: SHA-256-HMAC-Digest des rohen Request-Body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [params]
              properties:
                params:
                  type: object
                  additionalProperties: true
                  description: Runtime-Eingabe-Schlüssel-Wert-Paare
                context:
                  type: object
                  additionalProperties: true
                  properties:
                    assistant_id:
                      type: string
      responses:
        "200":
          description: Synchrone Ausführung abgeschlossen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowTriggerSyncResponse"
        "202":
          description: Asynchrone Ausführung akzeptiert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  run_id:
                    type: string
        "400":
          description: Ungültige Anfrage oder ungültige Signatur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Synchrone Ausführung fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowTriggerSyncResponse"

