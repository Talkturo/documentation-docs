  /phone-numbers/telnyx-webhook:
    post:
      tags:
        - Telefonnummern
        - Webhooks
      summary: Telnyx-KYC-Compliance-Webhook
      operationId: telnyxPhoneNumberWebhook
      description: |
        Carrier-Webhook für Telnyx-KYC- / Requirement-Group-Statusänderungen.
        Verifiziert die ED25519-Signatur mit TELNYX_PUBLIC_KEY. Gibt 503 zurück, wenn der Schlüssel
        nicht konfiguriert ist, 400 bei ungültiger Signatur. Gibt nach erfolgreicher Verarbeitung immer 200 zurück.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Rohe Telnyx-Event-Payload
              additionalProperties: true
      responses:
        "200":
          description: Webhook akzeptiert
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  status:
                    type: string
                  updated:
                    type: boolean
                  matchedRequest:
                    type: boolean
        "400":
          description: Signaturverifizierung fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: TELNYX_PUBLIC_KEY nicht konfiguriert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /phone-numbers/twilio-webhook:
    post:
      tags:
        - Telefonnummern
        - Webhooks
      summary: Twilio-Bundle-Status-Webhook
      operationId: twilioPhoneNumberWebhook
      description: |
        Carrier-Callback für Twilio-Bundle-Statusänderungen. Kein Signatur-Header erforderlich.
        Ruft den aktuellen Bundle-Status von Twilio erneut ab, bevor Datensätze aktualisiert werden. Gibt immer 200 zurück.
      security: []
      requestBody:
        required: true
        content:
